name: Publish DropMe Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'scripts/**'
      - 'manifest.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: dropme-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble portable application
        shell: pwsh
        run: ./scripts/assemble.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath manifest.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" ./dist/DropMePortable.zip ./dist/DropMePortable.sha256.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "DropMe Portable $version" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
